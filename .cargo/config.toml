# ==============================================================================
# Nom du fichier : .cargo/config.toml
# Révision : 1.1
# Description : Configuration Cargo pour le noyau QBX (UEFI / Limine)
# Intégrations :
#   1. Suppression du runner bootimage (incompatible avec Limine).
#   2. Ajout du drapeau link-arg=-Tlinker.ld pour charger le noyau en higher-half.
# ==============================================================================

[build]
target = "x86_64-unknown-none"

[unstable]
build-std = ["core", "compiler_builtins", "alloc"]
build-std-features = ["compiler-builtins-mem"]

[target.'cfg(target_os = "none")']
rustflags = [
    "-C", "relocation-model=static",
    "-C", "link-arg=-Tlinker.ld"
]
